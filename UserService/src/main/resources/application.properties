spring.application.name=UserService
server.port=8081

spring.datasource.driver-class-name=org.apache.shardingsphere.driver.ShardingSphereDriver
spring.datasource.url= jdbc:shardingsphere:classpath:sharding.yaml

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.kafka.bootstrap-servers=broker:9092

topic.kafka.user-created=user.created
topic.kafka.topup-initiated=topup.initiated
topic.kafka.transaction-initiated=transaction.initiated
topic.kafka.wallet-balance-added=wallet.balance.added
topic.kafka.wallet-balance-deducted=wallet.balance.deducted
topic.kafka.wallet-balance-deduction-failed=wallet.balance.deduction.failed
topic.kafka.wallet-transfer-success=wallet.transfer.success
topic.kafka.wallet-transfer-failed=wallet.transfer.failed
app.kafka.transfer-completed=transaction.completed
app.kafka.transfer-failed=transaction.failed

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always