# docker-compose.yml
services:

  nginx:
    image: nginx:latest
    container_name: api-gateway-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      user-service:
        condition: service_healthy
      transaction-service:
        condition: service_healthy
      wallet-service:
        condition: service_healthy
      topup-service:
        condition: service_healthy
    networks:
      - onepay-networks
    healthcheck:
      test: ["CMD-SHELL", "nginx -t"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  user-service:
    build:
      context: ./UserService
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://ds0:3306/db_1
      - SPRING_DATASOURCE_URL_2=jdbc:mysql://ds1:3306/db_2 # Contoh jika ada datasource kedua
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=broker:9092
    depends_on:
      ds0:
        condition: service_healthy
      ds1:
        condition: service_healthy
      broker:
        condition: service_healthy
    networks:
      - onepay-networks
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  transaction-service:
    build:
      context: ./TransactionService
      dockerfile: Dockerfile
    container_name: transaction-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgresql-db-transactions:5432/transactions
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=broker:9092
    depends_on:
      postgresql-db-transactions:
        condition: service_healthy
      broker:
        condition: service_healthy
    networks:
      - onepay-networks
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  wallet-service:
    build:
      context: ./WalletService
      dockerfile: Dockerfile
    container_name: wallet-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://wallet_db0:5432/wallet_db
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=broker:9092
    depends_on:
      wallet_db0:
        condition: service_healthy
      broker:
        condition: service_healthy
    networks:
      - onepay-networks
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  topup-service:
    build:
      context: ./TopupService
      dockerfile: Dockerfile
    container_name: topup-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://wallet_db0:5432/wallet_db
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=broker:9092
    depends_on:
      wallet_db0:
        condition: service_healthy
      broker:
        condition: service_healthy
    networks:
      - onepay-networks
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s


  ds0:
    image: mysql:8.0
    container_name: user_db0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: db_1
    ports:
      - "3306:3306"
    volumes:
      - user_db0_data:/var/lib/mysql
    networks:
      - onepay-networks
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psecret"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  ds1:
    image: mysql:8.0
    container_name: user_db1
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: db_2
    ports:
      - "3307:3306"
    volumes:
      - user_db1_data:/var/lib/mysql
    networks:
      - onepay-networks
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psecret"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
  
  # ds2:
  #   image: postgres:13
  #   container_name: user_db2
  #   restart: always
  #   ports:
  #     - "5436:5432"
  #   environment:
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: secret
  #     POSTGRES_DB: db_3
  #   volumes:
  #     -  user_db2_data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U postgres"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 10
  #     start_period: 30s
  #   networks:
  #     - onepay-networks

  postgresql-db-transactions:
    image: postgres:13
    container_name: transaction_db0
    restart: always
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: transactions
    volumes:
      - transaction_db0_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks:
      - onepay-networks

  wallet_db0:
    image: postgres:14-alpine
    container_name: wallet_db0
    restart: always
    ports:
      - "5435:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=wallet_db
    volumes:
      - wallet_db0_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks:
      - onepay-networks

  broker:
    image: 'bitnami/kafka:latest'
    container_name: kafka-broker
    ports:
      - "9092:9092"
    networks:
      - onepay-networks
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka-broker:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LOG_DIRS=/bitnami/kafka/data/kraft-combined-logs
      - KAFKA_KRAFT_CLUSTER_ID=WDd1smWIQ-ChsMmr7OLvwQ
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD", "/opt/bitnami/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  user_db0_data:
  user_db1_data:
  user_db2_data:
  transaction_db0_data:
  wallet_db0_data:
  kafka_data:
    driver: local

networks:
  onepay-networks:
    driver: bridge
