# sharding.yaml
mode:
  type: Standalone
  repository:
    type: JDBC

dataSources:
  db0:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://report_db0:3306/reportdb0?useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: secret
  db1:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://report_db1:3306/reportdb1?useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: secret
  db2:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: org.postgresql.Driver
    jdbcUrl: jdbc:postgresql://report_db2:5432/reportdb2
    username: postgres
    password: secret

rules:
  - !SHARDING
    tables:
      reports:
        actualDataNodes: db${0..2}.reports
    defaultDatabaseStrategy:
      standard:
        shardingColumn: user_id
        shardingAlgorithmName: database_inline
    defaultTableStrategy:
      none:
    shardingAlgorithms:
      database_inline:
        type: INLINE
        props:
          algorithm-expression: db${Math.abs(user_id.hashCode()) % 3}

props:
  sql-show: false